<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>لينجو – تعلّم الإنجليزية</title>
<style>
:root{--bg:#fff;--tx:#3c3c3c;--mut:#afafaf;--bd:#e5e5e5;--card:#fff;--g:#58cc02;--gd:#58a700;--b:#1cb0f6;--bdk:#1899d6;--r:#ff4b4b;--rd:#ea2b2b;--y:#ffc800;--yd:#e5a500;--okb:#d7ffb8;--badb:#ffdfe0;--lock:#e5e5e5;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#131f24;--tx:#f1f7fb;--mut:#7a8b94;--bd:#37464f;--card:#1b2b32;--okb:#1d3a14;--badb:#3b1a1c;--lock:#37464f}}
:root[data-theme="dark"]{--bg:#131f24;--tx:#f1f7fb;--mut:#7a8b94;--bd:#37464f;--card:#1b2b32;--okb:#1d3a14;--badb:#3b1a1c;--lock:#37464f}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--tx);font-family:"Segoe UI",Tahoma,"Noto Sans Arabic",system-ui,sans-serif;min-height:100vh}
button{font:inherit;cursor:pointer;color:inherit}
#app{max-width:520px;margin:0 auto;min-height:100vh;position:relative}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;justify-content:space-around;padding:10px 8px;border-bottom:2px solid var(--bd);font-weight:800}
.top span{display:flex;gap:4px;align-items:center;animation:pop .4s}
.unit{margin:16px 12px 8px;padding:14px 16px;border-radius:16px;color:#fff;font-weight:800;box-shadow:0 4px 0 rgba(0,0,0,.2)}
.unit small{display:block;opacity:.85;font-weight:600}
.path{display:flex;flex-direction:column;align-items:center;padding:12px 0 24px;gap:18px}
.node{width:78px;height:72px;border-radius:50%;border:0;font-size:30px;position:relative;transition:transform .1s}
.node:active{transform:translateY(4px);box-shadow:none!important}
.node.done{background:var(--y);box-shadow:0 6px 0 var(--yd)}
.node.cur{background:var(--g);box-shadow:0 6px 0 var(--gd);animation:pulse 1.6s infinite}
.node.lock{background:var(--lock);box-shadow:0 6px 0 var(--bd);filter:grayscale(1);opacity:.8}
.node .lb{position:absolute;top:-34px;left:50%;transform:translateX(-50%);background:var(--card);color:var(--g);border:2px solid var(--bd);border-radius:12px;padding:3px 12px;font-size:14px;font-weight:800;animation:bounce 1s infinite;white-space:nowrap}
.mascot{font-size:46px;text-align:center;animation:bounce 2s infinite}
@keyframes bounce{50%{transform:translate(-50%,-6px)}}
.mascot{animation:bob 2s infinite}
@keyframes bob{50%{transform:translateY(-8px)}}
@keyframes pulse{50%{box-shadow:0 6px 0 var(--gd),0 0 0 10px rgba(88,204,2,.25)}}
@keyframes pop{0%{transform:scale(.6)}60%{transform:scale(1.2)}}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
@keyframes up{from{transform:translateY(100%)}}
@keyframes fall{to{transform:translateY(105vh) rotate(720deg)}}
.shake{animation:shake .3s}
.lh{display:flex;align-items:center;gap:12px;padding:16px;font-weight:800}
.x{background:none;border:0;font-size:22px;color:var(--mut)}
.pb{flex:1;height:16px;background:var(--bd);border-radius:9px;overflow:hidden}
.pb i{display:block;height:100%;background:var(--g);border-radius:9px;transition:width .4s;position:relative}
.pb i:after{content:"";position:absolute;inset:3px 8px auto;height:4px;background:rgba(255,255,255,.35);border-radius:4px}
.body{padding:8px 18px 150px}
h2{font-size:22px;margin:8px 0 18px}
.big{font-size:30px;font-weight:800;direction:ltr;text-align:center;margin:10px 0 4px}
.emo{font-size:70px;text-align:center}
.spk{display:block;margin:10px auto;width:70px;height:70px;border-radius:50%;border:2px solid var(--bd);border-bottom-width:5px;background:var(--card);font-size:30px}
.opts{display:grid;gap:10px;margin-top:14px}
.opt{padding:14px;border:2px solid var(--bd);border-bottom-width:5px;border-radius:14px;background:var(--card);font-size:18px;font-weight:700;text-align:center}
.opt.sel{border-color:var(--b);background:rgba(28,176,246,.14);color:var(--b)}
.opt.en{direction:ltr}
.ans{min-height:64px;border-top:2px solid var(--bd);border-bottom:2px solid var(--bd);padding:8px 0;margin:14px 0;display:flex;flex-wrap:wrap;gap:8px;direction:ltr;align-content:flex-start}
.bank{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;direction:ltr}
.chip{padding:10px 14px;border:2px solid var(--bd);border-bottom-width:5px;border-radius:12px;background:var(--card);font-size:18px;font-weight:700;animation:pop .25s}
.chip.empty{visibility:hidden}
.mt{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mt .opt{padding:16px 6px}
.opt.ok{border-color:var(--g);background:var(--okb);color:var(--g);opacity:.5;pointer-events:none}
.opt.bad{border-color:var(--r);background:var(--badb);color:var(--r);animation:shake .3s}
.ft{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:520px;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px));border-top:2px solid var(--bd);background:var(--bg)}
.ft.ok{background:var(--okb);color:var(--gd);animation:up .25s}
.ft.bad{background:var(--badb);color:var(--rd);animation:up .25s}
.ft b{display:block;font-size:20px;margin-bottom:10px}
.btn{width:100%;padding:14px;border:0;border-radius:14px;background:var(--g);color:#fff;font-size:17px;font-weight:800;box-shadow:0 5px 0 var(--gd)}
.btn:active{transform:translateY(4px);box-shadow:none}
.btn:disabled{background:var(--bd);color:var(--mut);box-shadow:0 5px 0 var(--bd);cursor:default}
.ft.bad .btn{background:var(--r);box-shadow:0 5px 0 var(--rd)}
.btn.blue{background:var(--b);box-shadow:0 5px 0 var(--bdk)}
.inp{width:100%;padding:14px;border:2px solid var(--bd);border-radius:14px;background:var(--card);color:var(--tx);font-size:20px;margin-top:16px;text-align:left;outline:none}.inp:focus{border-color:var(--b)}.pic .opt{font-size:48px;padding:10px}
.fin{text-align:center;padding:50px 20px}
.fin .mascot{font-size:90px}
.stats{display:flex;gap:10px;justify-content:center;margin:24px 0}
.st{flex:1;border:2px solid var(--y);border-radius:14px;overflow:hidden;font-weight:800;animation:pop .5s backwards}
.st small{display:block;background:var(--y);color:#fff;padding:4px}
.st div{padding:12px;font-size:22px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:flex-end;justify-content:center;z-index:20}
.modal>div{background:var(--bg);width:100%;max-width:520px;border-radius:24px 24px 0 0;padding:24px;text-align:center;animation:up .3s;display:grid;gap:12px}
.cf{position:fixed;top:-20px;width:10px;height:14px;z-index:30;animation:fall 2.5s linear forwards;pointer-events:none}
.pg{padding:8px 14px 100px}
.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:520px;display:flex;background:var(--bg);border-top:2px solid var(--bd);padding-bottom:env(safe-area-inset-bottom,0px);z-index:6}
.nav button{flex:1;border:0;background:none;padding:8px 0;font-size:11px;font-weight:700;color:var(--mut)}
.nav button span{display:block;font-size:24px;transition:transform .2s}
.nav button.on{color:var(--b)}.nav button.on span{transform:scale(1.25) translateY(-2px)}
.card{display:flex;align-items:center;gap:12px;padding:14px;border:2px solid var(--bd);border-bottom-width:5px;border-radius:16px;margin:10px 0;background:var(--card);animation:pop .3s}
.card.me{border-color:var(--b);background:rgba(28,176,246,.12)}
.btn.sm{width:auto;padding:10px 14px;font-size:14px}
.chip2{margin:12px auto 0;width:max-content;padding:8px 16px;border:2px solid var(--bd);border-radius:20px;font-weight:800;cursor:pointer}
.goal{margin:12px 8px 0}.goal small{color:var(--mut);font-weight:700}
.ach{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;text-align:center;font-size:12px;font-weight:700}
.ach div{border:2px solid var(--y);border-radius:14px;padding:10px 4px;animation:pop .4s}.ach div.off{filter:grayscale(1);opacity:.4;border-color:var(--bd)}.ach span{display:block;font-size:32px}
.tgl{width:46px;height:26px;border-radius:13px;background:var(--bd);position:relative;transition:.2s}.tgl:after{content:'';position:absolute;top:3px;right:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:.2s}.tgl.on{background:var(--g)}.tgl.on:after{right:23px}
.seg{border:2px solid var(--bd);background:none;border-radius:10px;padding:6px 12px;font-weight:700}.seg.on{border-color:var(--b);color:var(--b);background:rgba(28,176,246,.12)}
.lnk{display:block;margin:14px auto;background:none;border:0;color:var(--mut);font-weight:700}
.toast{position:fixed;top:70px;left:50%;transform:translateX(-50%);background:#333;color:#fff;padding:10px 18px;border-radius:12px;z-index:40;animation:pop .3s;max-width:90%;text-align:center;font-weight:700}
.login{padding:50px 24px;text-align:center;display:grid;gap:10px}.login h1{margin:0;color:var(--g);font-size:40px}.login small{color:var(--mut)}
.av{border:0;background:none;font-size:34px;padding:4px}.sg{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0}.sg div{border:2px solid var(--bd);border-radius:14px;padding:12px;font-weight:800;text-align:center}
#fx{position:fixed;inset:0;perspective:700px;pointer-events:none;z-index:50;overflow:hidden}.p3{position:absolute;left:0;top:0;line-height:1;will-change:transform}
.fl{position:fixed;inset:0;z-index:45;pointer-events:none;animation:flo .8s forwards}@keyframes flo{from{opacity:1}to{opacity:0}}
.pop{position:fixed;left:50%;bottom:170px;font-size:28px;font-weight:900;z-index:60;white-space:nowrap;pointer-events:none;color:var(--y);text-shadow:0 3px 0 rgba(0,0,0,.25);animation:rise 1.2s forwards}
@keyframes rise{0%{opacity:0;transform:perspective(500px) translate3d(-50%,30px,-250px) scale(.4)}25%{opacity:1;transform:perspective(500px) translate3d(-50%,-10px,40px) scale(1.25)}100%{opacity:0;transform:perspective(500px) translate3d(-50%,-120px,120px) scale(1)}}
@keyframes thud{0%{transform:translateY(-7px)}35%{transform:translateY(5px) scale(.995)}65%{transform:translateY(-1px)}100%{transform:none}}.thud{animation:thud .34s cubic-bezier(.3,1.4,.5,1)}
@keyframes heavy{0%,100%{transform:none}15%{transform:translate(-11px,7px) rotate(-.7deg)}35%{transform:translate(9px,3px) rotate(.5deg)}55%{transform:translate(-5px,2px)}75%{transform:translate(3px,1px)}}.heavy{animation:heavy .5s ease-out}
.mh{display:inline-block;animation:hop .55s}@keyframes hop{40%{transform:translateY(-14px) rotate(-12deg) scale(1.25)}70%{transform:translateY(2px)}}
.fin{perspective:800px}.medal{display:inline-block;font-size:120px;transform-style:preserve-3d;text-shadow:0 12px 0 rgba(0,0,0,.15);filter:drop-shadow(0 0 22px rgba(255,200,0,.7));animation:drop 1s cubic-bezier(.3,1.6,.5,1),spin3d 3.5s 1s infinite linear}
.medal.sad{filter:grayscale(.7);animation:drop 1s cubic-bezier(.3,1.6,.5,1),wob 3s 1s infinite ease-in-out}.medal.mid{filter:drop-shadow(0 0 18px rgba(28,176,246,.7))}
@keyframes drop{0%{opacity:0;transform:translateY(-300px) scale(.3)}60%{opacity:1;transform:translateY(20px) scale(1.15)}100%{transform:none}}@keyframes spin3d{to{transform:rotateY(360deg)}}@keyframes wob{50%{transform:rotate(-9deg) translateY(8px)}}
.stars{font-size:56px;margin:8px 0;perspective:500px}.s3{display:inline-block;opacity:0;animation:star3d .7s cubic-bezier(.3,1.6,.5,1) forwards}@keyframes star3d{from{opacity:0;transform:rotateY(180deg) scale(.1) translateZ(-200px)}to{opacity:1;transform:none}}
.lvl{margin:10px auto;padding:10px 16px;border-radius:14px;background:var(--y);color:#fff;font-weight:900;width:max-content;animation:pop .6s 2.4s backwards}.sadscr{filter:saturate(.5)}
.node.sk{background:#ce82ff;box-shadow:0 6px 0 #a560d9;filter:none;opacity:1}
.scene{perspective:1100px;height:480px;margin:6px 0 14px}.cardx{position:relative;width:100%;height:100%;transform-style:preserve-3d;transition:transform .65s cubic-bezier(.4,1.3,.5,1);cursor:pointer}.cardx.flp{transform:rotateY(180deg)}
.face{position:absolute;inset:0;padding:16px;overflow:auto;border:2px solid var(--bd);border-bottom-width:7px;border-radius:26px;background:var(--card);backface-visibility:hidden;-webkit-backface-visibility:hidden;display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center}.back{transform:rotateY(180deg);justify-content:center;border-color:var(--b)}
.cimg{font-size:92px;line-height:1.1;filter:drop-shadow(0 8px 6px rgba(0,0,0,.18))}.crow{display:flex;align-items:center;gap:10px;justify-content:center}.cw{font-family:'Fredoka','Baloo 2',Georgia,serif;font-size:46px;color:var(--g);letter-spacing:1px;direction:ltr}
.ib{width:46px;height:46px;border-radius:50%;border:2px solid var(--bd);border-bottom-width:5px;background:var(--card);font-size:20px}.sn{font-size:19px;font-weight:700}.sn span{direction:ltr}
.rvb{background:none;border:2px dashed var(--bd);border-radius:12px;padding:6px 12px;font-weight:700;color:var(--mut)}.tr{font-weight:700;padding:6px 10px;border-radius:12px;background:rgba(28,176,246,.12);max-width:100%}.gnote{background:rgba(255,200,0,.18);font-size:14px;text-align:right}
.bt{font-size:40px;font-weight:900;color:var(--b)}.hint{color:var(--mut);margin-top:auto}
</style>

<script>
const $=s=>document.querySelector(s),app=$('#app');
const U=[
{t:'أساسيات المحادثة',c:'#58cc02',L:[
{n:'التحيات',e:'👋',w:[['Hello','مرحبا','👋'],['Goodbye','مع السلامة','🚪'],['Thanks','شكرا','🙏'],['Please','من فضلك','🤲'],['Sorry','آسف','😔']],s:[['Hello my friend','مرحبا يا صديقي'],['Thanks a lot','شكرا جزيلا']]},
{n:'العائلة',e:'👨‍👩‍👧',w:[['Mother','أم','👩'],['Father','أب','👨'],['Brother','أخ','👦'],['Sister','أخت','👧'],['Friend','صديق','🧑‍🤝‍🧑']],s:[['I love my mother','أنا أحب أمي'],['He is my brother','هو أخي']]},
{n:'الطعام',e:'🍎',w:[['Water','ماء','💧'],['Bread','خبز','🍞'],['Apple','تفاحة','🍎'],['Milk','حليب','🥛'],['Rice','أرز','🍚']],s:[['I drink water','أنا أشرب الماء'],['She eats an apple','هي تأكل تفاحة']]}]},
{t:'العالم من حولك',c:'#1cb0f6',L:[
{n:'الحيوانات',e:'🐱',w:[['Cat','قطة','🐱'],['Dog','كلب','🐶'],['Bird','طائر','🐦'],['Fish','سمكة','🐟'],['Horse','حصان','🐴']],s:[['The cat is small','القطة صغيرة'],['I have a dog','لدي كلب']]},
{n:'الألوان',e:'🎨',w:[['Red','أحمر','🔴'],['Blue','أزرق','🔵'],['Green','أخضر','🟢'],['Yellow','أصفر','🟡'],['Black','أسود','⚫']],s:[['The sky is blue','السماء زرقاء'],['I like red','أنا أحب الأحمر']]},
{n:'الأرقام',e:'🔢',w:[['One','واحد','1️⃣'],['Two','اثنان','2️⃣'],['Three','ثلاثة','3️⃣'],['Four','أربعة','4️⃣'],['Five','خمسة','5️⃣']],s:[['I have two books','لدي كتابان'],['Three apples please','ثلاث تفاحات من فضلك']]}]},
{t:'الحياة اليومية',c:'#ce82ff',L:[
{n:'المنزل',e:'🏠',w:[['House','منزل','🏠'],['Door','باب','🚪'],['Table','طاولة','🪑'],['Bed','سرير','🛏️'],['Window','نافذة','🪟']],s:[['Open the door','افتح الباب'],['The house is big','المنزل كبير']]},
{n:'الأفعال',e:'🏃',w:[['Run','يركض','🏃'],['Read','يقرأ','📖'],['Sleep','ينام','😴'],['Write','يكتب','✍️'],['Play','يلعب','⚽']],s:[['I read a book','أنا أقرأ كتابا'],['They play football','هم يلعبون كرة القدم']]},
{n:'الوقت',e:'⏰',w:[['Today','اليوم','📅'],['Tomorrow','غدا','🌅'],['Night','ليل','🌙'],['Morning','صباح','☀️'],['Week','أسبوع','🗓️']],s:[['See you tomorrow','أراك غدا'],['Good morning','صباح الخير']]}]}];
const LS=[];U.forEach((u,ui)=>u.L.forEach(l=>{l.u=ui;LS.push(l)}));
const ALLW=LS.flatMap(l=>l.w);
const SW=[...new Set(LS.flatMap(x=>x.s.flatMap(s=>s[0].split(' '))))];
const C=['Good ___ teacher|morning|bad,fine|صباح الخير يا معلم','Nice to ___ you|meet|eat,see|سررت بلقائك','My mother ___ a teacher|is|am,are|أمي معلمة','I have two ___|sisters|sister,brother|لدي أختان','I ___ bread every day|eat|drink,read|آكل الخبز كل يوم','She ___ milk|drinks|drink,eat|هي تشرب الحليب','The bird can ___|fly|run,eat|الطائر يستطيع الطيران','Dogs ___ big|are|is,am|الكلاب كبيرة','The grass is ___|green|red,blue|العشب أخضر','Bananas are ___|yellow|black,blue|الموز أصفر','I have ___ hands|two|one,five|لدي يدان','One plus one is ___|two|four,three|واحد زائد واحد يساوي اثنان','I sleep in the ___|bed|door,table|أنام على السرير','Close the ___|window|water,milk|أغلق النافذة','He ___ every morning|runs|run,running|هو يركض كل صباح','They ___ English|read|reads,sleep|هم يقرؤون الإنجليزية','I wake up in the ___|morning|night,week|أستيقظ في الصباح','The moon comes out at ___|night|morning,today|يظهر القمر في الليل'].map(s=>{const[t,a,d,ar]=s.split('|');return{t,a,d:d.split(','),ar,full:t.replace('___',a)}});
const DEF=()=>({xp:0,gems:50,hearts:5,streak:0,last:'',pg:[0,0],path:0,dxp:0,ls:0,pf:0,dd:'',cl:[],fr:0,bx:0,av:'🦉',tot:0,pfa:0,wk:0,ht:0,set:{snd:1,fx:1,slow:0,goal:30,th:'auto'}});
let S=DEF(),UN='';
const save=()=>{try{if(UN)localStorage.setItem('lg_s_'+UN,JSON.stringify(S))}catch(e){}};
const sh=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
let ac;function snd(f,d=.15,t='sine'){try{ac=ac||new AudioContext();const o=ac.createOscillator(),g=ac.createGain();o.type=t;o.frequency.value=f;g.gain.value=.12;o.connect(g);g.connect(ac.destination);o.start();o.stop(ac.currentTime+d)}catch(e){}}
const good=()=>{snd(660);setTimeout(()=>snd(880),90)},bad=()=>snd(180,.3,'sawtooth');
function say(t){try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='en-US';u.rate=.9;speechSynthesis.speak(u)}catch(e){}}
function confetti(){for(let i=0;i<60;i++){const d=document.createElement('i');d.className='cf';d.style.cssText=`left:${Math.random()*100}vw;background:hsl(${Math.random()*360},90%,60%);animation-delay:${Math.random()*.6}s;animation-duration:${2+Math.random()*1.5}s`;document.body.appendChild(d);setTimeout(()=>d.remove(),4500)}}

function home(){
 let h=`<div class="top"><span>🔥 ${S.streak}</span><span>💎 ${S.gems}</span><span>⚡ ${S.xp}</span><span>❤️ ${S.hearts}</span></div>`;
 let k=0;
 U.forEach((u,ui)=>{
  h+=`<div class="unit" style="background:${u.c}"><small>الوحدة ${ui+1}</small>${u.t}</div><div class="path">`;
  u.L.forEach(l=>{const i=LS.indexOf(l),st=i<S.done?'done':i==S.done?'cur':'lock',off=[0,45,0,-45][k++%4];
   h+=`<button class="node ${st}" style="transform:translateX(${off}px)" onclick="start(${i})" aria-label="${l.n}">${st=='lock'?'🔒':st=='done'?'⭐':l.e}${st=='cur'?'<span class="lb">ابدأ</span>':''}</button>`});
  h+=`</div>`});
 h+=`<div class="mascot">🦉</div><p style="text-align:center;color:var(--mut);padding-bottom:30px">أكمل الدروس لتفتح المزيد!</p>`;
 app.innerHTML=h;scrollTo(0,0)}

let L,q,sel;
